<span class="fire-sentence">
{{- range $wIdx, $word := (split .Inner " ") -}}
  <span class="fire-word">
  {{- range $cIdx, $c := (split $word "") -}}
    {{- $seed := add (mul $wIdx 7) $cIdx -}}
    {{- $delay := div (float (mod $seed 8)) 8.0 -}}
    {{- $dur := add 0.75 (div (float (mod $seed 5)) 8.0) -}}
    <span class="fire-char" style="animation-delay: -{{ printf "%.2f" $delay }}s; animation-duration: {{ printf "%.2f" $dur }}s;">{{ $c }}</span>
  {{- end -}}
  </span>{{ " " }}
{{- end -}}
</span>

<style>
.fire-sentence {
  display: inline;
  position: relative;
}

.fire-word {
  display: inline-block;
  white-space: nowrap;
  position: relative;
  vertical-align: baseline;
}

.fire-char {
  display: inline-block;
  font-weight: 800;
  position: relative;
  color: #fff8eb;
  animation-name: fire-char-burn;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

.fire-char::after {
  content: "";
  position: absolute;
  top: -2px;
  left: 50%;
  width: 6px;
  height: 9px;
  margin-left: -3px;
  background: radial-gradient(ellipse at bottom, rgba(255, 240, 100, 0.95) 15%, rgba(255, 110, 0, 0.7) 45%, rgba(255, 0, 0, 0) 75%);
  border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0;
  animation-name: fire-spark-rise;
  animation-timing-function: ease-in;
  animation-iteration-count: infinite;
  animation-delay: inherit;
  animation-duration: inherit;
}

@keyframes fire-char-burn {
  0% {
    text-shadow:
      0 0 2px #ffffff,
      0 -1.5px 4px #ffea00,
      -0.5px -3px 8px #ff7700,
      0.5px -6px 12px #ff2200,
      0 -9px 18px rgba(200, 0, 0, 0.75);
    transform: translateY(0px);
  }
  50% {
    text-shadow:
      0 0 4px #ffffff,
      0.5px -2.5px 6px #ffff44,
      -0.5px -5px 11px #ff9900,
      0.5px -8px 16px #ff3300,
      -0.5px -12px 24px rgba(255, 20, 0, 0.9);
    transform: translateY(-0.8px) scale(1.02);
  }
  100% {
    text-shadow:
      0 0 2px #ffffff,
      -0.5px -2px 4px #ffcc00,
      0.5px -4px 9px #ff5500,
      -0.5px -7px 14px #ff1100,
      0.5px -10px 20px rgba(180, 0, 0, 0.7);
    transform: translateY(0px);
  }
}

@keyframes fire-spark-rise {
  0% {
    opacity: 0;
    transform: translateY(2px) scale(0.5);
  }
  30% {
    opacity: 0.9;
  }
  100% {
    opacity: 0;
    transform: translateY(-14px) scale(1.3);
  }
}

/* Zertretene Schnecke (Squashed Snail) */
.squashed-snail {
  display: inline-block;
  cursor: pointer;
  user-select: none;
  transform-origin: bottom center;
  transform: scaleX(1.7) scaleY(0.22) skewX(-20deg);
  text-shadow: 
    0px 2px 4px rgba(107, 142, 35, 0.8),
    -3px 0px 6px rgba(139, 69, 19, 0.6),
    3px 0px 6px rgba(139, 69, 19, 0.6);
  filter: grayscale(0.4) brightness(0.85);
  transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), 
              text-shadow 0.15s ease-out,
              filter 0.15s ease-out;
}

.squashed-snail:hover {
  filter: grayscale(0.2) brightness(0.95);
  text-shadow: 
    0px 3px 6px rgba(107, 142, 35, 1),
    -4px 0px 8px rgba(139, 69, 19, 0.8),
    4px 0px 8px rgba(139, 69, 19, 0.8);
}

/* Zitternde Rakete (Shaking Rocket) */
.shaking-rocket {
  display: inline-block;
  cursor: pointer;
  user-select: none;
  transform-origin: center center;
  animation: rocket-vibrate 0.08s linear infinite alternate;
  filter: drop-shadow(0 0 4px rgba(255, 140, 0, 0.85)) drop-shadow(0 2px 8px rgba(255, 60, 0, 0.6));
  transition: transform 0.2s;
}

@keyframes rocket-vibrate {
  0% {
    transform: translate(-1px, 1px) rotate(-1.5deg);
  }
  25% {
    transform: translate(1.5px, -1px) rotate(1.5deg);
  }
  50% {
    transform: translate(-1.5px, -0.5px) rotate(-1deg);
  }
  75% {
    transform: translate(1px, 1.5px) rotate(1.5deg);
  }
  100% {
    transform: translate(0.5px, -1.5px) rotate(-0.5deg);
  }
}

.shaking-rocket:hover {
  animation-duration: 0.04s;
  filter: drop-shadow(0 0 6px rgba(255, 220, 0, 1)) drop-shadow(0 4px 12px rgba(255, 60, 0, 0.95));
  transform: scale(1.35);
}
</style>
