<li>
    <a href="{{ .Permalink }}" title="{{ .Title }}">
        {{ if and .Date (eq .Kind "page") }}<span class="post-date">[{{ .Date.Format "2006-01-02" }}{{ if and (not .Lastmod.IsZero) (gt .Lastmod.Unix .Date.Unix) }} | mod: {{ .Lastmod.Format "2006-01-02" }}{{ end }}]</span>{{ end }}
        {{ .Title | markdownify }}
    </a>
</li>
